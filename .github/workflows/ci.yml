name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-bookworm
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential python3 nodejs ca-certificates file binutils zip
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Go test
        working-directory: src
        run: go test ./...

      - name: Go vet
        working-directory: src
        run: go vet ./...

      - name: JavaScript syntax check
        working-directory: src
        run: node --check ui.js

      - name: Build linux/amd64 plugin
        run: bash ./scripts/build.sh

      - name: ABI smoke
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          cd src
          python3 abi_smoke.py "../dist/key-chain-router-v${VERSION}.so"

      - name: Binary inspection
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          file "dist/key-chain-router-v${VERSION}.so"
          nm -D "dist/key-chain-router-v${VERSION}.so" | grep -E 'cliproxy_plugin_init|keyChainRouterPluginCall|keyChainRouterPluginFree|keyChainRouterPluginShutdown'
          ldd "dist/key-chain-router-v${VERSION}.so"

      - name: Package artifact
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p package
          cp "dist/key-chain-router-v${VERSION}.so" package/
          cp dist/key-chain-router.so package/
          cp README.md TESTING.md config.example.yaml package/
          (cd package && sha256sum "key-chain-router-v${VERSION}.so" key-chain-router.so > SHA256SUMS)
          tar -C package -czf "key-chain-router-v${VERSION}-linux-amd64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: key-chain-router-linux-amd64
          path: |
            package/
            key-chain-router-v*-linux-amd64.tar.gz
          if-no-files-found: error
