name: Issue 10 Review P1 Fix

on:
  push:
    branches:
      - tmp-issue10-p1-fix

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[issue-10-p1-done]')"
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-bookworm
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential python3 nodejs ca-certificates file binutils zip
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
        with:
          ref: tmp-issue10-p1-fix
          fetch-depth: 0
      - name: Apply review fix
        run: python3 scripts/issue10_review_p1.py
      - name: Format and test
        run: |
          gofmt -w src/main.go src/scheduler_auth.go src/issue10_test.go src/review_findings_test.go
          cd src
          go test ./...
          go vet ./...
          node --check ui.js
      - name: Build and ABI smoke
        run: |
          bash ./scripts/build.sh
          VERSION="$(tr -d '[:space:]' < VERSION)"
          cd src
          python3 abi_smoke.py "../dist/key-chain-router-v${VERSION}.so"
      - name: Commit reviewed fix and remove helpers
        run: |
          ROOT=/__w/cpa-plugin-key-chain-router/cpa-plugin-key-chain-router
          git config --global --add safe.directory "$ROOT"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$ROOT" rm .github/workflows/issue10-review-p1.yml scripts/issue10_review_p1.py
          git -C "$ROOT" add src/main.go src/scheduler_auth.go src/issue10_test.go src/review_findings_test.go src/abi_smoke.py
          git -C "$ROOT" diff --cached --check
          git -C "$ROOT" commit -m 'fix: preserve AuthIndex scheduler compatibility (#10) [issue-10-p1-done]'
          git -C "$ROOT" push origin HEAD:tmp-issue10-p1-fix
