name: Issue 13 Concurrency Review Fixes

on:
  push:
    branches:
      - fix/issue-13-health-aware-failback

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[issue-13-concurrency-done]')"
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-bookworm
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential python3 nodejs ca-certificates file binutils zip
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-13-health-aware-failback
          fetch-depth: 0
      - name: Apply concurrency review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, got {n}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          # A probe lease may only be released by the attempt that acquired it.
          replace_once(
              'src/v4_health.go',
              'func releaseCandidateProbeV4(p *Policy, r *PolicyRule, c *PolicyCandidate) {\n\tkey := candidateHealthKeyV4(p, r, c)\n',
              'func releaseCandidateProbeV4(p *Policy, r *PolicyRule, c *PolicyCandidate, owned bool) {\n\tif !owned {\n\t\treturn\n\t}\n\tkey := candidateHealthKeyV4(p, r, c)\n',
          )

          p = Path('src/v4_execution.go')
          s = p.read_text()

          # Carry the exact failover action into the next atomic candidate acquisition.
          needle = '\tcurrentPriority := math.MaxInt\n'
          if s.count(needle) != 2:
              raise SystemExit(f'expected two currentPriority blocks, got {s.count(needle)}')
          s = s.replace(needle, needle + '\tnextAction := failNext\n', 2)
          s = s.replace('nextHealthyCandidateV4(p, r, ranked, attempted, failNext, currentPriority)', 'nextHealthyCandidateV4(p, r, ranked, attempted, nextAction, currentPriority)')

          old_follow = '\t\tnext := peekHealthyCandidateV4(p, r, ranked, attempted, action, currentPriority)\n\t\tif next == nil {\n\t\t\tbreak\n\t\t}\n\t\tranked = moveCandidateFirstV4(ranked, next.ID)\n'
          if s.count(old_follow) != 3:
              raise SystemExit(f'expected three peek/move blocks, got {s.count(old_follow)}')
          s = s.replace(old_follow, '\t\tnextAction = action\n', 3)

          # Stream JSON/decode and empty stream-id failures must also preserve configured action.
          old = '\t\tif err = json.Unmarshal(raw, &sr); err != nil {\n\t\t\tar.Error = err.Error()\n\t\t\tevent.Attempts = append(event.Attempts, ar)\n\t\t\tlastErr = err\n\t\t\trecordCandidateFailureV4(p, r, c, 0, err, nil, probe)\n\t\t\tcontinue\n\t\t}\n'
          new = '\t\tif err = json.Unmarshal(raw, &sr); err != nil {\n\t\t\tar.Error = err.Error()\n\t\t\tevent.Attempts = append(event.Attempts, ar)\n\t\t\tlastErr = err\n\t\t\trecordCandidateFailureV4(p, r, c, 0, err, nil, probe)\n\t\t\taction := failureActionV4(r.Failover, 0, err)\n\t\t\tif action == failCPADefault {\n\t\t\t\trunCPADefaultStreamV4(event, source, clientModel, body, headers, query, alt, callbackID, outStreamID, started)\n\t\t\t\treturn\n\t\t\t}\n\t\t\tif action == failStop {\n\t\t\t\tbreak\n\t\t\t}\n\t\t\tnextAction = action\n\t\t\tcontinue\n\t\t}\n'
          if s.count(old) != 1:
              raise SystemExit('stream json failure block not found exactly once')
          s = s.replace(old, new, 1)

          old = '\t\tif sr.StreamID == "" {\n\t\t\tlastErr = errors.New("host stream id 为空")\n\t\t\tevent.Attempts[len(event.Attempts)-1].Error = lastErr.Error()\n\t\t\trecordCandidateFailureV4(p, r, c, 0, lastErr, sr.Headers, probe)\n\t\t\tcontinue\n\t\t}\n'
          new = '\t\tif sr.StreamID == "" {\n\t\t\tlastErr = errors.New("host stream id 为空")\n\t\t\tevent.Attempts[len(event.Attempts)-1].Error = lastErr.Error()\n\t\t\trecordCandidateFailureV4(p, r, c, 0, lastErr, sr.Headers, probe)\n\t\t\taction := failureActionV4(r.Failover, 0, lastErr)\n\t\t\tif action == failCPADefault {\n\t\t\t\trunCPADefaultStreamV4(event, source, clientModel, body, headers, query, alt, callbackID, outStreamID, started)\n\t\t\t\treturn\n\t\t\t}\n\t\t\tif action == failStop {\n\t\t\t\tbreak\n\t\t\t}\n\t\t\tnextAction = action\n\t\t\tcontinue\n\t\t}\n'
          if s.count(old) != 1:
              raise SystemExit('empty stream id block not found exactly once')
          s = s.replace(old, new, 1)

          # For first-read failures, preserve the configured action before returning to outer loop.
          old = '\t\t\t\tif first {\n\t\t\t\t\tevent.Attempts[len(event.Attempts)-1].Error = e.Error()\n\t\t\t\t\tevent.Attempts[len(event.Attempts)-1].Status = statusFromError(e)\n\t\t\t\t\tbreak\n\t\t\t\t}\n'
          new = '\t\t\t\tif first {\n\t\t\t\t\tevent.Attempts[len(event.Attempts)-1].Error = e.Error()\n\t\t\t\t\tevent.Attempts[len(event.Attempts)-1].Status = statusFromError(e)\n\t\t\t\t\taction := failureActionV4(r.Failover, statusFromError(e), e)\n\t\t\t\t\tif action == failCPADefault {\n\t\t\t\t\t\trunCPADefaultStreamV4(event, source, clientModel, body, headers, query, alt, callbackID, outStreamID, started)\n\t\t\t\t\t\treturn\n\t\t\t\t\t}\n\t\t\t\t\tif action == failStop {\n\t\t\t\t\t\tbreak\n\t\t\t\t\t}\n\t\t\t\t\tnextAction = action\n\t\t\t\t\tbreak\n\t\t\t\t}\n'
          if s.count(old) != 1:
              raise SystemExit('first stream read error block not found')
          s = s.replace(old, new, 1)

          old = '\t\t\t\tif first {\n\t\t\t\t\tevent.Attempts[len(event.Attempts)-1].Error = rr.Error\n\t\t\t\t\tbreak\n\t\t\t\t}\n'
          new = '\t\t\t\tif first {\n\t\t\t\t\tevent.Attempts[len(event.Attempts)-1].Error = rr.Error\n\t\t\t\t\taction := failureActionV4(r.Failover, 0, lastErr)\n\t\t\t\t\tif action == failCPADefault {\n\t\t\t\t\t\trunCPADefaultStreamV4(event, source, clientModel, body, headers, query, alt, callbackID, outStreamID, started)\n\t\t\t\t\t\treturn\n\t\t\t\t\t}\n\t\t\t\t\tif action == failStop {\n\t\t\t\t\t\tbreak\n\t\t\t\t\t}\n\t\t\t\t\tnextAction = action\n\t\t\t\t\tbreak\n\t\t\t\t}\n'
          if s.count(old) != 1:
              raise SystemExit('first stream rr.Error block not found')
          s = s.replace(old, new, 1)

          if s.count('releaseCandidateProbeV4(p, r, c)') != 1:
              raise SystemExit(f'expected one releaseCandidateProbeV4 call, got {s.count("releaseCandidateProbeV4(p, r, c)")}')
          s = s.replace('releaseCandidateProbeV4(p, r, c)', 'releaseCandidateProbeV4(p, r, c, probe)', 1)
          p.write_text(s)

          t = Path('src/issue13_health_test.go')
          ts = t.read_text()
          if 'TestIssue13ReleaseProbeRequiresOwnership' not in ts:
              ts += (
                  '\n\nfunc TestIssue13ReleaseProbeRequiresOwnership(t *testing.T) {\n'
                  '\tresetIssue13Health(t)\n'
                  '\tp, r, ranked := issue13Fixture()\n'
                  '\ta := ranked[0]\n'
                  '\trecordCandidateFailureV4(p, r, a, 503, nil, nil)\n'
                  '\tkey := candidateHealthKeyV4(p, r, a)\n'
                  '\tv4Runtime.Lock()\n'
                  '\tv4Runtime.health[key].NextProbeAt = time.Now().Add(-time.Millisecond)\n'
                  '\tv4Runtime.Unlock()\n'
                  '\tif got, probe := nextHealthyCandidateV4(p, r, ranked, map[string]bool{}, failNext, int(^uint(0)>>1)); got == nil || got.ID != "a" || !probe {\n'
                  '\t\tt.Fatalf("expected A probe, got=%v probe=%v", got, probe)\n'
                  '\t}\n'
                  '\treleaseCandidateProbeV4(p, r, a, false)\n'
                  '\tv4Runtime.RLock()\n'
                  '\tstillOwned := v4Runtime.health[key].ProbeInFlight\n'
                  '\tv4Runtime.RUnlock()\n'
                  '\tif !stillOwned {\n'
                  '\t\tt.Fatal("non-owner released another attempt probe lease")\n'
                  '\t}\n'
                  '\treleaseCandidateProbeV4(p, r, a, true)\n'
                  '\tv4Runtime.RLock()\n'
                  '\treleased := !v4Runtime.health[key].ProbeInFlight\n'
                  '\tv4Runtime.RUnlock()\n'
                  '\tif !released {\n'
                  '\t\tt.Fatal("owner failed to release probe lease")\n'
                  '\t}\n'
                  '}\n'
              )
          if 'TestIssue13NextPriorityAcquisitionNeverReturnsCurrentPriority' not in ts:
              ts += (
                  '\n\nfunc TestIssue13NextPriorityAcquisitionNeverReturnsCurrentPriority(t *testing.T) {\n'
                  '\tresetIssue13Health(t)\n'
                  '\tp, r, ranked := issue13Fixture()\n'
                  '\tsame := &PolicyCandidate{ID: "same", Name: "Same", Provider: "codex", AuthIndex: "idx-same", Enabled: true, Priority: 100, Weight: 1}\n'
                  '\tr.Candidates = []*PolicyCandidate{ranked[0], same, ranked[1]}\n'
                  '\tranked = []*PolicyCandidate{ranked[0], same, ranked[1]}\n'
                  '\tattempted := map[string]bool{"a": true}\n'
                  '\trecordCandidateFailureV4(p, r, ranked[1], 503, nil, nil)\n'
                  '\tgot, _ := nextHealthyCandidateV4(p, r, ranked, attempted, failNextPriority, 100)\n'
                  '\tif got != nil {\n'
                  '\t\tt.Fatalf("next-priority returned %s at priority %d; want nil while lower priority is unhealthy", got.ID, got.Priority)\n'
                  '\t}\n'
                  '}\n'
              )
          t.write_text(ts)
          PY
      - name: Format and test
        run: |
          gofmt -w src/v4_health.go src/v4_execution.go src/issue13_health_test.go
          cd src
          go test ./...
          go vet ./...
          node --check ui.js
      - name: Build and ABI smoke
        run: |
          bash ./scripts/build.sh
          VERSION="$(tr -d '[:space:]' < VERSION)"
          cd src
          python3 abi_smoke.py "../dist/key-chain-router-v${VERSION}.so"
      - name: Commit fixes and remove helper
        run: |
          ROOT="$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$ROOT"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f "$ROOT/.github/workflows/issue13-concurrency-fix.yml"
          git -C "$ROOT" add -A
          git -C "$ROOT" diff --cached --check
          git -C "$ROOT" commit -m 'fix: preserve failover action and probe lease ownership (#13) [issue-13-concurrency-done]'
          git -C "$ROOT" pull --rebase origin fix/issue-13-health-aware-failback
          git -C "$ROOT" push origin HEAD:fix/issue-13-health-aware-failback
