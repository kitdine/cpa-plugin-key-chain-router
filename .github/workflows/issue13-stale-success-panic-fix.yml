name: Issue 13 Stale Success Panic Fix

on:
  push:
    branches:
      - fix/issue-13-health-aware-failback

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[issue-13-stale-success-done]')"
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-bookworm
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential python3 nodejs ca-certificates file binutils zip
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-13-health-aware-failback
          fetch-depth: 0
      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, got {n}')
              return s.replace(old, new, 1)

          hp = Path('src/v4_health.go')
          hs = hp.read_text()
          old = '''func recordCandidateSuccessV4(p *Policy, r *PolicyRule, c *PolicyCandidate) {
	key := candidateHealthKeyV4(p, r, c)
	if key == "" {
		return
	}
	now := time.Now()
	v4Runtime.Lock()
	defer v4Runtime.Unlock()
	h := candidateHealthStateLockedV4(key)
	h.State = healthClosed
	h.ProbeInFlight = false
	h.ConsecutiveFailures = 0
	h.BackoffLevel = 0
	h.LastStatus = 0
	h.LastError = ""
	h.LastSuccessAt = now
	h.OpenedAt = time.Time{}
	h.NextProbeAt = time.Time{}
}
'''
          new = '''func recordCandidateSuccessV4(p *Policy, r *PolicyRule, c *PolicyCandidate, probeOwned bool) {
	key := candidateHealthKeyV4(p, r, c)
	if key == "" {
		return
	}
	now := time.Now()
	v4Runtime.Lock()
	defer v4Runtime.Unlock()
	h := candidateHealthStateLockedV4(key)
	h.LastSuccessAt = now

	wasClosed := h.State == "" || h.State == healthClosed
	ownsCurrentProbe := probeOwned && h.State == healthHalfOpen && h.ProbeInFlight
	if !wasClosed && !ownsCurrentProbe {
		// A request that started while the candidate was still CLOSED may complete
		// after another request opened the circuit or while a HALF_OPEN probe is in
		// flight. Its stale success is useful telemetry, but it must not cancel the
		// current recovery cycle or another request's probe lease.
		return
	}

	h.State = healthClosed
	h.ProbeInFlight = false
	h.ConsecutiveFailures = 0
	h.BackoffLevel = 0
	h.LastStatus = 0
	h.LastError = ""
	h.OpenedAt = time.Time{}
	h.NextProbeAt = time.Time{}
}
'''
          hs = once(hs, old, new, 'recordCandidateSuccessV4')

          old = '''	h.ProbeInFlight = false
	h.State = healthOpen
	h.NextProbeAt = time.Now()
}
'''
          new = '''	h.ProbeInFlight = false
	h.State = healthOpen
	now := time.Now()
	if h.NextProbeAt.IsZero() || h.NextProbeAt.Before(now) {
		h.NextProbeAt = now
	}
}
'''
          hs = once(hs, old, new, 'releaseCandidateProbeV4 deadline')
          hp.write_text(hs)

          ep = Path('src/v4_execution.go')
          es = ep.read_text()
          if es.count('recordCandidateSuccessV4(p, r, c)') != 2:
              raise SystemExit(f'production success calls: expected 2, got {es.count("recordCandidateSuccessV4(p, r, c)")}')
          es = es.replace('recordCandidateSuccessV4(p, r, c)', 'recordCandidateSuccessV4(p, r, c, probe)', 2)

          old = '''	var lastErr error
	defer func() {
		if x := recover(); x != nil {
			_ = closeOutputStream(outStreamID, fmt.Sprintf("panic: %v", x))
		}
	}()
'''
          new = '''	var lastErr error
	var activeCandidate *PolicyCandidate
	activeProbe := false
	defer func() {
		if x := recover(); x != nil {
			// A panic after HALF_OPEN acquisition must never strand ProbeInFlight.
			// releaseCandidateProbeV4 is ownership-gated and preserves any stronger
			// recovery deadline established while this probe was running.
			releaseCandidateProbeV4(p, r, activeCandidate, activeProbe)
			_ = closeOutputStream(outStreamID, fmt.Sprintf("panic: %v", x))
		}
	}()
'''
          es = once(es, old, new, 'stream panic defer')

          old = '''		if c == nil {
			break
		}
		attempted[c.ID] = true
		currentPriority = c.Priority
		model := c.OverrideModel
'''
          new = '''		if c == nil {
			break
		}
		activeCandidate = c
		activeProbe = probe
		attempted[c.ID] = true
		currentPriority = c.Priority
		model := c.OverrideModel
'''
          es = once(es, old, new, 'stream active acquisition')
          ep.write_text(es)

          tp = Path('src/issue13_health_test.go')
          ts = tp.read_text()
          if ts.count('recordCandidateSuccessV4(p, r, a)') != 1:
              raise SystemExit(f'test success call: expected 1, got {ts.count("recordCandidateSuccessV4(p, r, a)")}')
          ts = ts.replace('recordCandidateSuccessV4(p, r, a)', 'recordCandidateSuccessV4(p, r, a, true)', 1)

          if 'TestIssue13StaleSuccessCannotCancelRecoveryCycle' not in ts:
              ts += '''

func TestIssue13StaleSuccessCannotCancelRecoveryCycle(t *testing.T) {
	resetIssue13Health(t)
	p, r, ranked := issue13Fixture()
	a := ranked[0]
	key := candidateHealthKeyV4(p, r, a)

	// Two requests may have started while A was CLOSED. Once one fails and opens
	// the circuit, the other's later success is stale and must not close it.
	recordCandidateFailureV4(p, r, a, 503, nil, nil)
	recordCandidateSuccessV4(p, r, a, false)
	v4Runtime.RLock()
	openState := *v4Runtime.health[key]
	v4Runtime.RUnlock()
	if openState.State != healthOpen || openState.ProbeInFlight {
		t.Fatalf("stale normal success cancelled OPEN state: %#v", openState)
	}

	v4Runtime.Lock()
	v4Runtime.health[key].NextProbeAt = time.Now().Add(-time.Millisecond)
	v4Runtime.Unlock()
	got, probe := nextHealthyCandidateV4(p, r, ranked, map[string]bool{}, failNext, int(^uint(0)>>1))
	if got == nil || got.ID != "a" || !probe {
		t.Fatalf("expected A half-open probe, got=%v probe=%v", got, probe)
	}

	// Another stale normal success cannot steal/clear the current probe lease.
	recordCandidateSuccessV4(p, r, a, false)
	v4Runtime.RLock()
	half := *v4Runtime.health[key]
	v4Runtime.RUnlock()
	if half.State != healthHalfOpen || !half.ProbeInFlight {
		t.Fatalf("stale success cancelled HALF_OPEN probe: %#v", half)
	}

	// The actual probe owner is authoritative and may close the circuit.
	recordCandidateSuccessV4(p, r, a, true)
	v4Runtime.RLock()
	closed := *v4Runtime.health[key]
	v4Runtime.RUnlock()
	if closed.State != healthClosed || closed.ProbeInFlight || closed.BackoffLevel != 0 {
		t.Fatalf("probe owner did not close circuit: %#v", closed)
	}
}
'''
          if 'TestIssue13ProbeReleasePreservesStrongerDeadline' not in ts:
              ts += '''

func TestIssue13ProbeReleasePreservesStrongerDeadline(t *testing.T) {
	resetIssue13Health(t)
	p, r, ranked := issue13Fixture()
	a := ranked[0]
	key := candidateHealthKeyV4(p, r, a)
	recordCandidateFailureV4(p, r, a, 503, nil, nil)
	v4Runtime.Lock()
	v4Runtime.health[key].NextProbeAt = time.Now().Add(-time.Millisecond)
	v4Runtime.Unlock()
	if got, probe := nextHealthyCandidateV4(p, r, ranked, map[string]bool{}, failNext, int(^uint(0)>>1)); got == nil || !probe {
		t.Fatalf("expected probe, got=%v probe=%v", got, probe)
	}
	recordCandidateFailureV4(p, r, a, 429, nil, http.Header{"Retry-After": []string{"240"}}, false)
	v4Runtime.RLock()
	strong := v4Runtime.health[key].NextProbeAt
	v4Runtime.RUnlock()
	releaseCandidateProbeV4(p, r, a, true)
	v4Runtime.RLock()
	after := v4Runtime.health[key].NextProbeAt
	v4Runtime.RUnlock()
	if after.Before(strong) {
		t.Fatalf("probe release shortened stronger deadline: before=%v after=%v", strong, after)
	}
}
'''
          tp.write_text(ts)
          PY
      - name: Format and test
        run: |
          gofmt -w src/v4_health.go src/v4_execution.go src/issue13_health_test.go
          cd src
          go test ./...
          go vet ./...
          node --check ui.js
      - name: Build and ABI smoke
        run: |
          bash ./scripts/build.sh
          VERSION="$(tr -d '[:space:]' < VERSION)"
          cd src
          python3 abi_smoke.py "../dist/key-chain-router-v${VERSION}.so"
      - name: Commit fixes and remove helper
        run: |
          ROOT="$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$ROOT"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f "$ROOT/.github/workflows/issue13-stale-success-panic-fix.yml"
          git -C "$ROOT" add -A
          git -C "$ROOT" diff --cached --check
          git -C "$ROOT" commit -m 'fix: make recovery success and panic handling probe-owned (#13) [issue-13-stale-success-done]'
          git -C "$ROOT" pull --rebase origin fix/issue-13-health-aware-failback
          git -C "$ROOT" push origin HEAD:fix/issue-13-health-aware-failback
