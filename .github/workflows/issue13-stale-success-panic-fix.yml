name: Issue 13 Stale Success Panic Fix

on:
  push:
    branches:
      - fix/issue-13-health-aware-failback

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[issue-13-stale-success-done]')"
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-bookworm
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential python3 nodejs ca-certificates file binutils zip
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-13-health-aware-failback
          fetch-depth: 0
      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def block(lines):
              return "\n".join(lines) + "\n"

          hp = Path('src/v4_health.go')
          hs = hp.read_text()
          pattern = re.compile(r'func recordCandidateSuccessV4\(p \*Policy, r \*PolicyRule, c \*PolicyCandidate\) \{.*?\n\}\n\nfunc releaseCandidateProbeV4', re.S)
          success = block([
              'func recordCandidateSuccessV4(p *Policy, r *PolicyRule, c *PolicyCandidate, probeOwned bool) {',
              '\tkey := candidateHealthKeyV4(p, r, c)',
              '\tif key == "" {',
              '\t\treturn',
              '\t}',
              '\tnow := time.Now()',
              '\tv4Runtime.Lock()',
              '\tdefer v4Runtime.Unlock()',
              '\th := candidateHealthStateLockedV4(key)',
              '\th.LastSuccessAt = now',
              '',
              '\twasClosed := h.State == "" || h.State == healthClosed',
              '\townsCurrentProbe := probeOwned && h.State == healthHalfOpen && h.ProbeInFlight',
              '\tif !wasClosed && !ownsCurrentProbe {',
              '\t\t// A stale normal success is telemetry only; it cannot cancel an OPEN',
              '\t\t// recovery cycle or another request\'s HALF_OPEN probe lease.',
              '\t\treturn',
              '\t}',
              '',
              '\th.State = healthClosed',
              '\th.ProbeInFlight = false',
              '\th.ConsecutiveFailures = 0',
              '\th.BackoffLevel = 0',
              '\th.LastStatus = 0',
              '\th.LastError = ""',
              '\th.OpenedAt = time.Time{}',
              '\th.NextProbeAt = time.Time{}',
              '}',
              '',
              'func releaseCandidateProbeV4',
          ])
          hs, n = pattern.subn(success, hs, count=1)
          if n != 1:
              raise SystemExit(f'recordCandidateSuccessV4 replace count={n}')
          old = block([
              '\th.ProbeInFlight = false',
              '\th.State = healthOpen',
              '\th.NextProbeAt = time.Now()',
              '}',
          ])
          new = block([
              '\th.ProbeInFlight = false',
              '\th.State = healthOpen',
              '\tnow := time.Now()',
              '\tif h.NextProbeAt.IsZero() || h.NextProbeAt.Before(now) {',
              '\t\th.NextProbeAt = now',
              '\t}',
              '}',
          ])
          if hs.count(old) != 1:
              raise SystemExit(f'release deadline block count={hs.count(old)}')
          hs = hs.replace(old, new, 1)
          hp.write_text(hs)

          ep = Path('src/v4_execution.go')
          es = ep.read_text()
          if es.count('recordCandidateSuccessV4(p, r, c)') != 2:
              raise SystemExit(f'production success calls={es.count("recordCandidateSuccessV4(p, r, c)")}')
          es = es.replace('recordCandidateSuccessV4(p, r, c)', 'recordCandidateSuccessV4(p, r, c, probe)', 2)
          old = block([
              '\tvar lastErr error',
              '\tdefer func() {',
              '\t\tif x := recover(); x != nil {',
              '\t\t\t_ = closeOutputStream(outStreamID, fmt.Sprintf("panic: %v", x))',
              '\t\t}',
              '\t}()',
          ])
          new = block([
              '\tvar lastErr error',
              '\tvar activeCandidate *PolicyCandidate',
              '\tactiveProbe := false',
              '\tdefer func() {',
              '\t\tif x := recover(); x != nil {',
              '\t\t\t// Never strand a HALF_OPEN lease if the stream worker panics.',
              '\t\t\treleaseCandidateProbeV4(p, r, activeCandidate, activeProbe)',
              '\t\t\t_ = closeOutputStream(outStreamID, fmt.Sprintf("panic: %v", x))',
              '\t\t}',
              '\t}()',
          ])
          if es.count(old) != 1:
              raise SystemExit(f'panic defer count={es.count(old)}')
          es = es.replace(old, new, 1)
          old = block([
              '\t\tif c == nil {',
              '\t\t\tbreak',
              '\t\t}',
              '\t\tattempted[c.ID] = true',
              '\t\tcurrentPriority = c.Priority',
              '\t\tmodel := c.OverrideModel',
          ])
          new = block([
              '\t\tif c == nil {',
              '\t\t\tbreak',
              '\t\t}',
              '\t\tactiveCandidate = c',
              '\t\tactiveProbe = probe',
              '\t\tattempted[c.ID] = true',
              '\t\tcurrentPriority = c.Priority',
              '\t\tmodel := c.OverrideModel',
          ])
          if es.count(old) != 1:
              raise SystemExit(f'stream acquisition count={es.count(old)}')
          es = es.replace(old, new, 1)
          ep.write_text(es)

          tp = Path('src/issue13_health_test.go')
          ts = tp.read_text()
          if ts.count('recordCandidateSuccessV4(p, r, a)') != 1:
              raise SystemExit(f'test old success calls={ts.count("recordCandidateSuccessV4(p, r, a)")}')
          ts = ts.replace('recordCandidateSuccessV4(p, r, a)', 'recordCandidateSuccessV4(p, r, a, true)', 1)
          if 'TestIssue13StaleSuccessCannotCancelRecoveryCycle' not in ts:
              ts += block([
                  '',
                  'func TestIssue13StaleSuccessCannotCancelRecoveryCycle(t *testing.T) {',
                  '\tresetIssue13Health(t)',
                  '\tp, r, ranked := issue13Fixture()',
                  '\ta := ranked[0]',
                  '\tkey := candidateHealthKeyV4(p, r, a)',
                  '\trecordCandidateFailureV4(p, r, a, 503, nil, nil)',
                  '\trecordCandidateSuccessV4(p, r, a, false)',
                  '\tv4Runtime.RLock()',
                  '\topenState := *v4Runtime.health[key]',
                  '\tv4Runtime.RUnlock()',
                  '\tif openState.State != healthOpen || openState.ProbeInFlight {',
                  '\t\tt.Fatalf("stale normal success cancelled OPEN state: %#v", openState)',
                  '\t}',
                  '\tv4Runtime.Lock()',
                  '\tv4Runtime.health[key].NextProbeAt = time.Now().Add(-time.Millisecond)',
                  '\tv4Runtime.Unlock()',
                  '\tgot, probe := nextHealthyCandidateV4(p, r, ranked, map[string]bool{}, failNext, int(^uint(0)>>1))',
                  '\tif got == nil || got.ID != "a" || !probe {',
                  '\t\tt.Fatalf("expected A half-open probe, got=%v probe=%v", got, probe)',
                  '\t}',
                  '\trecordCandidateSuccessV4(p, r, a, false)',
                  '\tv4Runtime.RLock()',
                  '\thalf := *v4Runtime.health[key]',
                  '\tv4Runtime.RUnlock()',
                  '\tif half.State != healthHalfOpen || !half.ProbeInFlight {',
                  '\t\tt.Fatalf("stale success cancelled HALF_OPEN probe: %#v", half)',
                  '\t}',
                  '\trecordCandidateSuccessV4(p, r, a, true)',
                  '\tv4Runtime.RLock()',
                  '\tclosed := *v4Runtime.health[key]',
                  '\tv4Runtime.RUnlock()',
                  '\tif closed.State != healthClosed || closed.ProbeInFlight || closed.BackoffLevel != 0 {',
                  '\t\tt.Fatalf("probe owner did not close circuit: %#v", closed)',
                  '\t}',
                  '}',
              ])
          if 'TestIssue13ProbeReleasePreservesStrongerDeadline' not in ts:
              ts += block([
                  '',
                  'func TestIssue13ProbeReleasePreservesStrongerDeadline(t *testing.T) {',
                  '\tresetIssue13Health(t)',
                  '\tp, r, ranked := issue13Fixture()',
                  '\ta := ranked[0]',
                  '\tkey := candidateHealthKeyV4(p, r, a)',
                  '\trecordCandidateFailureV4(p, r, a, 503, nil, nil)',
                  '\tv4Runtime.Lock()',
                  '\tv4Runtime.health[key].NextProbeAt = time.Now().Add(-time.Millisecond)',
                  '\tv4Runtime.Unlock()',
                  '\tif got, probe := nextHealthyCandidateV4(p, r, ranked, map[string]bool{}, failNext, int(^uint(0)>>1)); got == nil || !probe {',
                  '\t\tt.Fatalf("expected probe, got=%v probe=%v", got, probe)',
                  '\t}',
                  '\trecordCandidateFailureV4(p, r, a, 429, nil, http.Header{"Retry-After": []string{"240"}}, false)',
                  '\tv4Runtime.RLock()',
                  '\tstrong := v4Runtime.health[key].NextProbeAt',
                  '\tv4Runtime.RUnlock()',
                  '\treleaseCandidateProbeV4(p, r, a, true)',
                  '\tv4Runtime.RLock()',
                  '\tafter := v4Runtime.health[key].NextProbeAt',
                  '\tv4Runtime.RUnlock()',
                  '\tif after.Before(strong) {',
                  '\t\tt.Fatalf("probe release shortened stronger deadline: before=%v after=%v", strong, after)',
                  '\t}',
                  '}',
              ])
          tp.write_text(ts)
          PY
      - name: Format and test
        run: |
          gofmt -w src/v4_health.go src/v4_execution.go src/issue13_health_test.go
          cd src
          go test ./...
          go vet ./...
          node --check ui.js
      - name: Build and ABI smoke
        run: |
          bash ./scripts/build.sh
          VERSION="$(tr -d '[:space:]' < VERSION)"
          cd src
          python3 abi_smoke.py "../dist/key-chain-router-v${VERSION}.so"
      - name: Commit fixes and remove helper
        run: |
          ROOT="$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$ROOT"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f "$ROOT/.github/workflows/issue13-stale-success-panic-fix.yml"
          git -C "$ROOT" add -A
          git -C "$ROOT" diff --cached --check
          git -C "$ROOT" commit -m 'fix: make recovery success and panic handling probe-owned (#13) [issue-13-stale-success-done]'
          git -C "$ROOT" pull --rebase origin fix/issue-13-health-aware-failback
          git -C "$ROOT" push origin HEAD:fix/issue-13-health-aware-failback
