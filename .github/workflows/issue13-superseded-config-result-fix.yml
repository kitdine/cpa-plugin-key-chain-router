name: Issue 13 Superseded Candidate Result Guard

on:
  push:
    branches:
      - fix/issue-13-health-aware-failback

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[issue-13-superseded-result-done]')"
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-bookworm
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential python3 nodejs ca-certificates file binutils zip
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-13-health-aware-failback
          fetch-depth: 0
      - name: Apply superseded candidate result guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch_func(text, signature, needle, addition):
              start = text.index(signature)
              end = text.find('\nfunc ', start + len(signature))
              if end < 0:
                  end = len(text)
              seg = text[start:end]
              if addition.strip() in seg:
                  return text
              if seg.count(needle) != 1:
                  raise SystemExit(f'{signature}: expected one needle, got {seg.count(needle)}')
              seg = seg.replace(needle, needle + addition, 1)
              return text[:start] + seg + text[end:]

          hp = Path('src/v4_health.go')
          hs = hp.read_text()
          helper = '''func candidateHealthConfigCurrentLockedV4(p *Policy, r *PolicyRule, c *PolicyCandidate) bool {
	if p == nil || r == nil || c == nil {
		return false
	}
	activePolicy := v4Runtime.state.Policies[strings.TrimSpace(p.KeyFingerprint)]
	if activePolicy == nil {
		return false
	}
	for _, activeRule := range activePolicy.Rules {
		if activeRule == nil || activeRule.ID != r.ID {
			continue
		}
		for _, activeCandidate := range activeRule.Candidates {
			if activeCandidate != nil && activeCandidate.ID == c.ID {
				return candidateHealthConfigEqualV4(activeCandidate, c)
			}
		}
		return false
	}
	return false
}

'''
          marker = 'func resetChangedCandidateHealthLockedV4('
          if 'func candidateHealthConfigCurrentLockedV4(' not in hs:
              if marker not in hs:
                  raise SystemExit('resetChangedCandidateHealthLockedV4 marker missing')
              hs = hs.replace(marker, helper + marker, 1)

          hs = patch_func(
              hs,
              'func candidateWouldBeSelectableV4(',
              '\tv4Runtime.RLock()\n',
              '\tif !candidateHealthConfigCurrentLockedV4(p, r, c) {\n\t\tv4Runtime.RUnlock()\n\t\treturn true\n\t}\n',
          )
          hs = patch_func(
              hs,
              'func acquireCandidateHealthV4(',
              '\tv4Runtime.Lock()\n\tdefer v4Runtime.Unlock()\n',
              '\tif !candidateHealthConfigCurrentLockedV4(p, r, c) {\n\t\treturn true, false\n\t}\n',
          )
          hs = patch_func(
              hs,
              'func recordCandidateFailureV4(',
              '\tv4Runtime.Lock()\n\tdefer v4Runtime.Unlock()\n',
              '\tif !candidateHealthConfigCurrentLockedV4(p, r, c) {\n\t\treturn\n\t}\n',
          )
          hs = patch_func(
              hs,
              'func recordCandidateSuccessV4(',
              '\tv4Runtime.Lock()\n\tdefer v4Runtime.Unlock()\n',
              '\tif !candidateHealthConfigCurrentLockedV4(p, r, c) {\n\t\treturn\n\t}\n',
          )
          hs = patch_func(
              hs,
              'func releaseCandidateProbeV4(',
              '\tv4Runtime.Lock()\n\tdefer v4Runtime.Unlock()\n',
              '\tif !candidateHealthConfigCurrentLockedV4(p, r, c) {\n\t\treturn\n\t}\n',
          )
          hp.write_text(hs)

          tp = Path('src/issue13_health_test.go')
          ts = tp.read_text()
          old_fixture = '''func issue13Fixture() (*Policy, *PolicyRule, []*PolicyCandidate) {
	a := &PolicyCandidate{ID: "a", Name: "A", Provider: "codex", AuthIndex: "idx-a", Enabled: true, Priority: 100, Weight: 1}
	b := &PolicyCandidate{ID: "b", Name: "B", Provider: "codex", AuthIndex: "idx-b", Enabled: true, Priority: 90, Weight: 1}
	r := &PolicyRule{ID: "r1", Name: "rule", Strategy: strategyOrdered, Candidates: []*PolicyCandidate{a, b}, Failover: defaultFailover()}
	p := &Policy{Name: "policy", KeyFingerprint: "fp", Enabled: true, Rules: []*PolicyRule{r}}
	return p, r, []*PolicyCandidate{a, b}
}
'''
          new_fixture = '''func issue13Fixture() (*Policy, *PolicyRule, []*PolicyCandidate) {
	a := &PolicyCandidate{ID: "a", Name: "A", Provider: "codex", AuthIndex: "idx-a", Enabled: true, Priority: 100, Weight: 1}
	b := &PolicyCandidate{ID: "b", Name: "B", Provider: "codex", AuthIndex: "idx-b", Enabled: true, Priority: 90, Weight: 1}
	r := &PolicyRule{ID: "r1", Name: "rule", Strategy: strategyOrdered, Candidates: []*PolicyCandidate{a, b}, Failover: defaultFailover()}
	p := &Policy{Name: "policy", KeyFingerprint: "fp", Enabled: true, Rules: []*PolicyRule{r}}
	v4Runtime.Lock()
	if v4Runtime.state.Policies == nil {
		v4Runtime.state.Policies = map[string]*Policy{}
	}
	v4Runtime.state.Policies[p.KeyFingerprint] = clonePolicyV4(p)
	v4Runtime.Unlock()
	return p, r, []*PolicyCandidate{a, b}
}
'''
          if old_fixture in ts:
              ts = ts.replace(old_fixture, new_fixture, 1)
          elif new_fixture not in ts:
              raise SystemExit('issue13Fixture block mismatch')

          old_reset = '''func resetIssue13Health(t *testing.T) {
	t.Helper()
	v4Runtime.Lock()
	old := v4Runtime.health
	v4Runtime.health = map[string]*candidateHealthState{}
	v4Runtime.Unlock()
	t.Cleanup(func() {
		v4Runtime.Lock()
		v4Runtime.health = old
		v4Runtime.Unlock()
	})
}
'''
          new_reset = '''func resetIssue13Health(t *testing.T) {
	t.Helper()
	v4Runtime.Lock()
	old := v4Runtime.health
	oldState := cloneV4State(v4Runtime.state)
	v4Runtime.health = map[string]*candidateHealthState{}
	v4Runtime.Unlock()
	t.Cleanup(func() {
		v4Runtime.Lock()
		v4Runtime.health = old
		v4Runtime.state = oldState
		v4Runtime.Unlock()
	})
}
'''
          if old_reset in ts:
              ts = ts.replace(old_reset, new_reset, 1)
          elif new_reset not in ts:
              raise SystemExit('resetIssue13Health block mismatch')

          if 'TestIssue13SupersededCandidateResultsCannotRecreateHealth' not in ts:
              ts += r'''

func TestIssue13SupersededCandidateResultsCannotRecreateHealth(t *testing.T) {
	resetIssue13Health(t)
	p, r, ranked := issue13Fixture()
	oldCandidate := ranked[0]
	key := candidateHealthKeyV4(p, r, oldCandidate)

	// Establish health for the original candidate, then replace its execution
	// configuration while preserving Policy/Rule/Candidate IDs.
	recordCandidateFailureV4(p, r, oldCandidate, 503, nil, nil)
	changed := clonePolicyV4(p)
	changed.Rules[0].Candidates[0].OverrideModel = "fixed-model"
	v4Runtime.Lock()
	resetChangedCandidateHealthLockedV4(v4Runtime.state.Policies[p.KeyFingerprint], changed)
	v4Runtime.state.Policies[p.KeyFingerprint] = clonePolicyV4(changed)
	_, presentAfterSave := v4Runtime.health[key]
	v4Runtime.Unlock()
	if presentAfterSave {
		t.Fatal("material config save retained old candidate health")
	}

	// A request that started before the save may still finish later. Its old
	// candidate clone must not recreate OPEN health for the replacement target.
	recordCandidateFailureV4(p, r, oldCandidate, 503, nil, nil)
	recordCandidateSuccessV4(p, r, oldCandidate, false)
	releaseCandidateProbeV4(p, r, oldCandidate, true)
	v4Runtime.RLock()
	_, recreated := v4Runtime.health[key]
	v4Runtime.RUnlock()
	if recreated {
		t.Fatal("superseded candidate result recreated health for replacement config")
	}

	// Results from the current replacement configuration are still authoritative.
	currentRule := changed.Rules[0]
	currentCandidate := currentRule.Candidates[0]
	recordCandidateFailureV4(changed, currentRule, currentCandidate, 503, nil, nil)
	v4Runtime.RLock()
	current := v4Runtime.health[key]
	v4Runtime.RUnlock()
	if current == nil || current.State != healthOpen {
		t.Fatalf("current replacement candidate failure was ignored: %#v", current)
	}
}
'''
          tp.write_text(ts)
          PY
      - name: Format and test
        run: |
          gofmt -w src/v4_health.go src/issue13_health_test.go
          cd src
          go test ./...
          go vet ./...
          node --check ui.js
      - name: Build and ABI smoke
        run: |
          bash ./scripts/build.sh
          VERSION="$(tr -d '[:space:]' < VERSION)"
          cd src
          python3 abi_smoke.py "../dist/key-chain-router-v${VERSION}.so"
      - name: Commit fix and remove helper
        run: |
          ROOT="$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$ROOT"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f "$ROOT/.github/workflows/issue13-superseded-config-result-fix.yml"
          git -C "$ROOT" add -A
          git -C "$ROOT" diff --cached --check
          git -C "$ROOT" commit -m 'fix: ignore superseded candidate health results (#13) [issue-13-superseded-result-done]'
          git -C "$ROOT" pull --rebase origin fix/issue-13-health-aware-failback
          git -C "$ROOT" push origin HEAD:fix/issue-13-health-aware-failback
