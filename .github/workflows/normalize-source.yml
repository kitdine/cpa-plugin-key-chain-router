name: Normalize source tree

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ contains(github.event.head_commit.message, 'normalize source tree') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize canonical source files
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/materialize-source.sh
          python3 - <<'PY'
          from pathlib import Path

          main = Path('src/main.go')
          text = main.read_text()
          old = 'func renderHTML() string { return pageHTML }\n\n//go:embed page.html\nvar pageHTML string\n'
          new = 'func renderHTML() string { return strings.Replace(pageHTML, "{{KEY_CHAIN_ROUTER_UI}}", uiJS, 1) }\n\n//go:embed page.html\nvar pageHTML string\n\n//go:embed ui.js\nvar uiJS string\n'
          if old not in text:
              raise SystemExit('expected page embed block not found')
          main.write_text(text.replace(old, new, 1))

          page = Path('src/page.html')
          html = page.read_text()
          start = html.find('<script>')
          end = html.rfind('</script>')
          if start < 0 or end < start:
              raise SystemExit('script block not found in page.html')
          js = html[start + len('<script>'):end].strip() + '\n'
          Path('src/ui.js').write_text(js)
          page.write_text(html[:start] + '<script>{{KEY_CHAIN_ROUTER_UI}}</script>' + html[end + len('</script>'):])

          Path('.gitignore').write_text('# build artifacts\ndist/\n*.so\n*.h\n*.tar.gz\n*.zip\nSHA256SUMS\nchecksums.txt\n\n# local plugin state\nkey-chain-router-state.json\n*.tmp\n\n# editor / OS\n.DS_Store\n.idea/\n.vscode/\n')
          PY

          git rm -r src/parts scripts/materialize-source.sh
          git add -f src/main.go src/page.html src/ui.js .gitignore

      - name: Commit canonical source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: store canonical source files'
          git push origin HEAD:main
