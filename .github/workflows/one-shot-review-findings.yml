name: One-shot outstanding review findings

on:
  push:
    branches:
      - fix/review-findings-v0.6.4

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'run outstanding review findings patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-findings-v0.6.4
          fetch-depth: 0

      - name: Apply patch
        run: |
          python3 scripts/review_findings_patch2.py
          python3 scripts/review_findings_patch.py

      - name: Validate
        run: |
          cd src
          go test ./...
          go vet ./...
          node --check ui.js
          cd ..
          git diff --check

      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-review-findings.yml scripts/review_findings_patch.py scripts/review_findings_patch2.py
          git add src/main.go src/scheduler_auth.go src/v4_types.go src/v4_execution.go src/v4_observability.go src/v062_sqlite_query.go src/ui.js src/review_findings_test.go
          git commit -m 'fix: resolve outstanding review findings'
          git push origin HEAD:fix/review-findings-v0.6.4
