name: One-shot v0.6.1 routing table UI

on:
  push:
    branches:
      - feat/v0.6.1-compact-routing-table

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'run one-shot v0.6.1 UI patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.6.1-compact-routing-table
          fetch-depth: 0

      - name: Patch routing log UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/v061_patch.py')
          s = p.read_text()
          old = "new_ui, n = re.subn(pattern, replacement + '\\n\\nload().catch', ui, count=1, flags=re.S)"
          new = "new_ui, n = re.subn(pattern, lambda _m: replacement + '\\n\\nload().catch', ui, count=1, flags=re.S)"
          if old not in s:
              raise SystemExit('target re.subn line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/v061_patch.py

      - name: Validate
        run: |
          node --check src/ui.js
          git diff --check
          grep -q 'event-table' src/page.html
          grep -q 'toggleEvent' src/ui.js

      - name: Commit generated UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-v061-ui.yml
          git rm -f scripts/v061_patch.py
          git add src/ui.js src/page.html
          git commit -m 'feat: compact routing events into expandable table'
          git push origin HEAD:feat/v0.6.1-compact-routing-table
