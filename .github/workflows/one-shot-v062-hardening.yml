name: One-shot v0.6.2 sqlite hardening

on:
  push:
    branches:
      - fix/v0.6.2-sqlite-persistence

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'run v0.6.2 sqlite hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.6.2-sqlite-persistence
          fetch-depth: 0
      - name: Harden sqlite failure handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/v4_observability.go')
          s = p.read_text()
          old = '''\tsink, err := newSQLiteSinkV4(path, o)\n\tif err != nil {\n\t\trecordSQLiteOpenErrorV62(err)\n\t\treturn err\n\t}\n\trecordSQLiteOpenV62(path)'''
          new = '''\tsink, err := newSQLiteSinkV4(path, o)\n\tif err != nil {\n\t\trecordSQLiteOpenErrorV62(err)\n\t\t_, _ = callHost("host.log", map[string]any{"level": "error", "message": "kcr sqlite open failed; continuing with memory observability", "fields": map[string]any{"path": path, "error": err.Error()}})\n\t\treturn nil\n\t}\n\trecordSQLiteOpenV62(path)'''
          if old not in s:
              raise SystemExit('sqlite open failure block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/v062_sqlite_query.go')
          s = p.read_text()
          s = s.replace('    _, _ = path, time.Now()\n', '    _ = path\n', 1)
          old = '''    if err := sink.db.QueryRow(`SELECT COUNT(*) FROM routing_attempts`).Scan(&attempts); err != nil {\n        out["probe_error"] = err.Error()\n    } else {\n        out["attempts"] = attempts\n    }\n    var journal string'''
          new = '''    if err := sink.db.QueryRow(`SELECT COUNT(*) FROM routing_attempts`).Scan(&attempts); err != nil {\n        out["probe_error"] = err.Error()\n    } else {\n        out["attempts"] = attempts\n    }\n    var lastPersisted string\n    if err := sink.db.QueryRow(`SELECT COALESCE(MAX(at),'') FROM routing_events`).Scan(&lastPersisted); err == nil {\n        out["last_persisted_at"] = lastPersisted\n    }\n    var journal string'''
          if old not in s:
              raise SystemExit('sqlite status count block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/ui.js')
          s = p.read_text()
          old = "        h.last_write_at ? '最后写入：' + h.last_write_at : '最后写入：暂无'"
          new = "        (h.last_write_at || h.last_persisted_at) ? '最后写入：' + (h.last_write_at || h.last_persisted_at) : '最后写入：暂无'"
          if old not in s:
              raise SystemExit('ui last write block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cd src
          go test ./...
          go vet ./...
          node --check ui.js
          cd ..
          git diff --check
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-v062-hardening.yml
          git add src/v4_observability.go src/v062_sqlite_query.go src/ui.js
          git commit -m 'fix: isolate sqlite failures from routing lifecycle'
          git push origin HEAD:fix/v0.6.2-sqlite-persistence
