name: One-shot v0.6.2 release prep

on:
  push:
    branches:
      - release/v0.6.2

permissions:
  contents: write

jobs:
  prep:
    if: github.event.head_commit.message == 'run v0.6.2 release prep 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.6.2
          fetch-depth: 0
      - name: Update release metadata
        run: python3 scripts/v062_release_prep.py
      - name: Validate
        run: |
          grep -q '^0.6.2$' VERSION
          grep -q '## v0.6.2' CHANGELOG.md
          grep -q 'SQLite ON + active' README.md
          git diff --check
      - name: Commit release prep
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-v062-release-prep.yml scripts/v062_release_prep.py
          git add VERSION CHANGELOG.md README.md
          git commit -m 'docs: prepare v0.6.2 release'
          git push origin HEAD:release/v0.6.2
