name: One-shot v0.6.2 sqlite persistence

on:
  push:
    branches:
      - fix/v0.6.2-sqlite-persistence

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'run v0.6.2 sqlite patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.6.2-sqlite-persistence
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/v062_patch.py

      - name: Validate
        run: |
          cd src
          go test ./...
          go vet ./...
          node --check ui.js
          cd ..
          git diff --check
          grep -q 'queryEventsSQLiteV62' src/v062_sqlite_query.go
          grep -q 'sqlite_status' src/v4_management.go
          grep -q 'SQLite 运行中' src/ui.js

      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-v062-sqlite.yml scripts/v062_patch.py
          git add src/v4_management.go src/v4_observability.go src/v062_sqlite_query.go src/v062_sqlite_test.go src/ui.js src/page.html
          git commit -m 'fix: make sqlite routing history persistent and queryable'
          git push origin HEAD:fix/v0.6.2-sqlite-persistence
