name: One-shot v0.6.3 browser local time

on:
  push:
    branches:
      - fix/v0.6.3-browser-local-time

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'run v0.6.3 local-time patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.6.3-browser-local-time
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/v063_patch.py
      - name: Validate
        run: |
          node --check src/ui.js
          TZ=Asia/Shanghai node -e "const d=new Date('2026-09-10T15:40:05Z'); const p=n=>String(n).padStart(2,'0'); const s=p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); if(s!=='09-10 23:40:05') throw new Error(s)"
          TZ=America/Los_Angeles node -e "const d=new Date('2026-09-10T15:40:05Z'); const p=n=>String(n).padStart(2,'0'); const s=p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); if(s!=='09-10 08:40:05') throw new Error(s)"
          cd src
          go test ./...
          go vet ./...
          cd ..
          git diff --check
          grep -q '^0.6.3$' VERSION
          grep -q '时间（本地）' src/ui.js
      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-v063-local-time.yml scripts/v063_patch.py
          git add src/ui.js VERSION CHANGELOG.md README.md
          git commit -m 'fix: show routing event time in browser local timezone'
          git push origin HEAD:fix/v0.6.3-browser-local-time
