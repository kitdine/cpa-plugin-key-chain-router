name: One-shot v0.6.4 release prep

on:
  push:
    branches:
      - release/v0.6.4

permissions:
  contents: write

jobs:
  prep:
    if: github.event.head_commit.message == 'run v0.6.4 release prep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.6.4
          fetch-depth: 0
      - name: Update release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('VERSION').write_text('0.6.4\n')

          p = Path('CHANGELOG.md')
          s = p.read_text()
          entry = '''## v0.6.4 - 2026-09-11

集中修复此前 Codex Review 中遗留的全部 findings，并建立“CI + Codex Review 零未解决 finding”后方可合并的发布流程。

### Scheduler

- `scheduler.pick` 在通过 `AuthIndex → host.auth.list → AuthID` 解析运行时 ID 前，重新验证目标 credential 仍存在于 CPA 本次 `Candidates` 中，避免绕过 cooldown/可用性筛选。
- 同一 `AuthIndex + Provider` 若仍映射到多个不同 AuthID，改为 fail closed，不再依赖返回顺序选择第一个。

### 可观测性

- 路由事件保留请求实际使用的 Rule 快照，`selection_reasons` 不再受到并发 Policy 编辑/删除影响。
- 移动端展开详情补齐桌面表格隐藏的时间、Model、Policy、Rule、Strategy、最终候选、Provider、状态、耗时与 Attempts。

### SQLite

- schema migration 改为先检查列是否存在；真实 `ALTER TABLE` / 历史数据清理失败会显式返回，不再静默吞错。
- 写入失败或队列溢出后，将 SQLite writer 标记为 degraded；在 sink 重启前路由记录查询回退 Memory，避免持续展示陈旧数据库历史。
- 一次路由记录查询中的统计、P95、列表、attempts 与 facets 改为同一只读事务快照，避免并发写入造成结果内部不一致。

### Review / CI

- 新增 scheduler eligibility、重复 AuthID 消歧、请求 Rule 快照、SQLite migration、writer degradation、transaction snapshot 等回归测试。
- PR #7 已通过完整 CI，且 Codex Review 完成后无任何新 finding；此前 PR #1–#5 的 9 个未 resolved review threads 已逐项修复并关闭。

'''
          anchor = '# Changelog\n\n'
          if '## v0.6.4 ' not in s:
              s = s.replace(anchor, anchor + entry, 1)
          p.write_text(s)

          p = Path('README.md')
          s = p.read_text()
          import re
          s = re.sub(r'^# CPA Key Chain Router v\d+\.\d+\.\d+', '# CPA Key Chain Router v0.6.4', s, count=1, flags=re.M)
          section = '''## v0.6.4 Review findings 修复\n\nv0.6.4 集中清理此前 Codex Review 的遗留问题：恢复 scheduler Candidates 资格检查并收紧 AuthID 消歧；路由选择原因使用请求时 Rule 快照；SQLite migration 不再吞错，writer 丢写后查询自动回退 Memory；路由记录查询使用一致的 SQLite 只读事务快照；移动端展开详情补齐所有隐藏字段。\n\n本版本开始，合并条件明确为：**标准 CI 全绿 + Codex Review 已完成 + unresolved findings = 0**。\n\n'''
          marker = '## v0.6.3 浏览器本地时间\n'
          if '## v0.6.4 Review findings 修复' not in s and marker in s:
              s = s.replace(marker, section + marker, 1)
          s = s.replace('key-chain-router-v0.6.3.so', 'key-chain-router-v0.6.4.so')
          p.write_text(s)
          PY
          grep -q '^0.6.4$' VERSION
          grep -q '## v0.6.4' CHANGELOG.md
          grep -q 'unresolved findings = 0' README.md
          git diff --check
      - name: Commit release prep
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-v064-release-prep.yml
          git add VERSION CHANGELOG.md README.md
          git commit -m 'docs: prepare v0.6.4 release'
          git push origin HEAD:release/v0.6.4
