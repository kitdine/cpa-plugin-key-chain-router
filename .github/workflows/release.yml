name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v, e.g. 0.3.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-bookworm
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential python3 nodejs ca-certificates file binutils zip
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test and build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash ./scripts/build.sh

      - name: ABI smoke
        working-directory: src
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 abi_smoke.py "../dist/key-chain-router-v${VERSION}.so"

      - name: Prepare release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release/package release/store
          cp "dist/key-chain-router-v${VERSION}.so" release/
          cp dist/key-chain-router.so release/
          cp README.md TESTING.md config.example.yaml release/package/
          cp "dist/key-chain-router-v${VERSION}.so" release/package/
          cp dist/key-chain-router.so release/package/
          (cd release && sha256sum "key-chain-router-v${VERSION}.so" key-chain-router.so > SHA256SUMS)
          cp release/SHA256SUMS release/package/
          tar -C release/package -czf "release/key-chain-router-v${VERSION}-linux-amd64.tar.gz" .

          cp "dist/key-chain-router-v${VERSION}.so" release/store/
          (cd release/store && zip -q "../key-chain-router_${VERSION}_linux_amd64.zip" "key-chain-router-v${VERSION}.so")
          (cd release && sha256sum "key-chain-router_${VERSION}_linux_amd64.zip" > checksums.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: key-chain-router-v${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/key-chain-router-v${{ steps.version.outputs.version }}.so
            release/key-chain-router.so
            release/key-chain-router-v${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            release/SHA256SUMS
            release/key-chain-router_${{ steps.version.outputs.version }}_linux_amd64.zip
            release/checksums.txt
