name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v, e.g. 0.3.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-bookworm
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential python3 nodejs ca-certificates file binutils
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Materialize source
        run: ./scripts/materialize-source.sh

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test and build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build.sh

      - name: JavaScript syntax check
        working-directory: src
        run: node --check ui.js

      - name: ABI smoke
        working-directory: src
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp ../dist/key-chain-router-v${VERSION}.so ../dist/key-chain-router-v0.3.0.so
          python3 abi_smoke.py ../dist/key-chain-router-v0.3.0.so
          rm -f ../dist/key-chain-router-v0.3.0.so

      - name: Prepare release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release/package
          cp "dist/key-chain-router-v${VERSION}.so" release/
          cp dist/key-chain-router.so release/
          cp README.md TESTING.md config.example.yaml release/package/
          cp "dist/key-chain-router-v${VERSION}.so" release/package/
          cp dist/key-chain-router.so release/package/
          (cd release && sha256sum "key-chain-router-v${VERSION}.so" key-chain-router.so > SHA256SUMS)
          cp release/SHA256SUMS release/package/
          tar -C release/package -czf "release/key-chain-router-v${VERSION}-linux-amd64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: key-chain-router-v${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/key-chain-router-v${{ steps.version.outputs.version }}.so
            release/key-chain-router.so
            release/key-chain-router-v${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            release/SHA256SUMS
