name: Prepare v0.6.5 Metadata

on:
  push:
    branches:
      - release/v0.6.5

permissions:
  contents: write

jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, '[v0.6.5-ready]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.6.5
          fetch-depth: 0
      - name: Prepare release metadata
        run: python3 scripts/release065_prepare.py
      - name: Validate metadata
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "0.6.5"
          grep -q '^## v0.6.5 - 2026-09-11$' CHANGELOG.md
          git diff --check
      - name: Commit release metadata and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release065-prepare.yml scripts/release065_prepare.py
          git add VERSION CHANGELOG.md
          git diff --cached --check
          git commit -m 'release: prepare v0.6.5 [v0.6.5-ready]'
          git push origin HEAD:release/v0.6.5
