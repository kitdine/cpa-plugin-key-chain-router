name: Apply v0.4 policy engine

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply v0.4 main patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Patch CPA plugin entrypoints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.go')
          s = p.read_text()
          replacements = [
              ('var pluginVersion = "0.3.0"', 'var pluginVersion = "0.4.0"'),
              ('case methodModelRoute:\n\t\treturn handleModelRoute(raw)', 'case methodModelRoute:\n\t\treturn handleModelRouteV4(raw)'),
              ('case methodExecutorExecute:\n\t\treturn handleExecute(raw, false)', 'case methodExecutorExecute:\n\t\treturn handleExecuteV4(raw, false)'),
              ('case methodExecutorExecuteStream:\n\t\treturn handleExecute(raw, true)', 'case methodExecutorExecuteStream:\n\t\treturn handleExecuteV4(raw, true)'),
              ('resp, err := handleAPI(req)', 'resp, err := handleAPIV4(req)'),
              ('{Path: "/status", Menu: "Key Chain Router", Description: "按 CPA 原生 API Key 配置有序上游故障切换链"}', '{Path: "/status", Menu: "Key Chain Router", Description: "按 CPA 原生 API Key 和模型规则执行可观测策略路由"}'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'expected patch text not found: {old!r}')
              s = s.replace(old, new, 1)
          old = 'func keyChainRouterPluginShutdown() {}'
          if old not in s:
              raise SystemExit('shutdown function not found')
          s = s.replace(old, 'func keyChainRouterPluginShutdown() { shutdownObservabilityV4() }', 1)
          old = '\truntimeState.Unlock()\n\treturn nil\n}\n\nfunc pluginRegistration() registration {'
          new = '\truntimeState.Unlock()\n\tif err := configureV4(statePath, st); err != nil {\n\t\treturn err\n\t}\n\treturn nil\n}\n\nfunc pluginRegistration() registration {'
          if old not in s:
              raise SystemExit('configure tail not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          gofmt -w src/*.go
      - name: Resolve dependencies and test
        shell: bash
        run: |
          cd src
          go mod tidy
          go test ./...
          go vet ./...
          node --check ui.js
      - name: Commit canonical v0.4 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.go src/go.mod src/go.sum src/v4_*.go
          git commit -m 'feat: activate v0.4 policy engine'
          git push origin HEAD:main
