plugins:
  enabled: true
  dir: "plugins"
  configs:
    key-chain-router:
      enabled: true
      priority: 100
      state_file: key-chain-router-state.json
      ticket_ttl_seconds: 30
      fallback_on_status: [401, 403, 408, 409, 429, 500, 502, 503, 504]
      no_fallback_on_status: [400, 404, 422]
