<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Key Chain Router</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#243244;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1500px;margin:0 auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.badge{background:#fff;border:1px solid #dbe3ef;border-radius:999px;padding:7px 12px;color:#65758b}.card{background:#fff;border:1px solid #dde5f0;border-radius:18px;padding:20px;margin-top:18px;box-shadow:0 8px 28px rgba(30,55,90,.06)}button{border:1px solid #cbd6e5;background:#fff;border-radius:10px;padding:10px 15px;font-weight:650;cursor:pointer}button.primary{background:#2563eb;color:#fff;border-color:#2563eb}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}.muted{color:#708096}.green{color:#16833d}.warn{color:#b45309}.route{padding:18px;border:1px solid #dbe3ef;border-radius:16px;margin-top:12px}.chain{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.pill{border:1px solid #d5dfec;border-radius:12px;padding:10px 12px;background:#fbfdff}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.modal{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.dialog{background:#fff;border-radius:18px;width:min(1200px,96vw);max-height:92vh;overflow:auto}.head{padding:20px;border-bottom:1px solid #e1e7f0}.body{padding:20px}.foot{padding:16px 20px;border-top:1px solid #e1e7f0;display:flex;justify-content:flex-end;gap:10px}label{font-weight:700;display:block;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid #ccd7e5;border-radius:10px;background:#fff;font:inherit}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.candidate{display:grid;grid-template-columns:1.3fr 1fr 1.3fr 110px 130px;gap:10px;align-items:end;padding:12px;border:1px solid #dde5ef;border-radius:12px;margin-top:10px}.diag{white-space:pre-wrap;background:#0f172a;color:#e5eefc;padding:14px;border-radius:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto}.note{padding:12px 14px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.oknote{padding:12px 14px;border-radius:12px;background:#effcf3;border:1px solid #b7e7c4;color:#166534}@media(max-width:800px){.grid2{grid-template-columns:1fr}.candidate{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">Key Chain Router</h1><p class="muted">按 CPA 原生 API Key 配置独立的有序上游 failover 链</p></div><div class="badge" id="versionBadge"></div></div><div id="env" class="card">正在读取当前 CPA 环境…</div><div class="row" style="margin-top:22px"><h2 class="grow">API Key 路由链</h2><button class="primary" onclick="openEditor()">新建路由</button></div><div id="routes"></div></div>
<div id="editModal" class="modal"><div class="dialog"><div class="head row"><div class="grow"><h2 id="editTitle" style="margin:0">新建路由</h2><div class="muted">匹配模型决定何时接管；候选覆盖模型留空时保持客户端原始 model。</div></div><button onclick="closeEditor()">×</button></div><div class="body"><div class="grid2"><div><label>路由名称</label><input id="rName" placeholder="例如：claude-mem"></div><div><label>下游 CPA API Key</label><select id="rKey"></select></div><div><label>路由状态</label><select id="rEnabled"><option value="true">启用</option><option value="false">停用</option></select></div><div><label>匹配模型</label><input id="rModels" value="*" placeholder="* 或 gpt-5.6-luna,claude-*"><div class="muted" style="margin-top:5px">支持 * / ? 通配符和逗号分隔。* = 这把 Key 的所有模型都由本路由接管。</div></div></div><div class="row"><h3 class="grow">候选链</h3><button onclick="clearOverrides()">全部改为继承原模型</button></div><div class="oknote">“覆盖模型/alias”留空 = 保持客户端原始 model；只有某个上游必须使用特定 alias/prefix 时才填写。</div><div id="cands"></div><button style="margin-top:12px" onclick="addCandidate()">添加候选</button></div><div class="foot"><button onclick="closeEditor()">取消</button><button class="primary" onclick="saveRoute()">保存</button></div></div></div>
<div id="diagModal" class="modal"><div class="dialog"><div class="head row"><div class="grow"><h2 style="margin:0">路由诊断</h2><div class="muted">静态检查候选可用性，并生成真实请求 curl。</div></div><button onclick="closeDiag()">×</button></div><div class="body"><div class="row"><input id="diagModel" class="grow" placeholder="输入要验证的客户端 model"><button onclick="runDiag()">刷新诊断</button></div><div id="diagBody" style="margin-top:14px"></div></div></div></div>
<script>{{KEY_CHAIN_ROUTER_UI}}</script></body></html>
